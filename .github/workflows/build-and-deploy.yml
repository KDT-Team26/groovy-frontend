# main 실배포 CI.
# S3+CloudFront 정적 배포로 전환하면서 Docker Hub/EKS 방식은 폐기함
name: Frontend Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC로 S3/CloudFront 배포용 IAM 역할을 assume하기 위해 필요

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::665206375378:role/groovy-github-actions-frontend-deploy-role
          aws-region: ap-northeast-2

      - name: Sync to S3
        run: aws s3 sync dist/ s3://groovy-prod-frontend-665206375378/ --delete

      # 클라우드 프론트 캐시 무효화
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E3TZL8GHIYRBVW --paths "/*"
